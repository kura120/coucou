name: NotchBuddy
options:
  bundleIdPrefix: dev.kura120
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

# DebugCloud = Debug, but signed with iCloud (CloudKit) and push entitlements
# and compiled with PHONE_LINK, for the iPhone link spike. ReleaseCloud = the
# same for a Developer ID build with its provisioning profile
# (scripts/cloud-test-build.sh); a Developer ID profile only allows the
# Production CloudKit environment, so the iPhone joins it with the
# PeikaPhoneProduction scheme. Release also compiles PHONE_LINK (the sync
# stays off until turned on in Settings); Debug stays unsigned without it.
configs:
  Debug: debug
  DebugCloud: debug
  Release: release
  ReleaseCloud: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Prevent Xcode from scanning Swift source and rewriting Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    DebugCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: ""
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Peika.entitlements
    ReleaseCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release
  PeikaAppStore:
    build:
      targets:
        PeikaAppStore: all
    run:
      config: Debug
    archive:
      config: Release
  NotchBuddyCloud:
    build:
      targets:
        NotchBuddy: all
    run:
      config: DebugCloud
    archive:
      config: Release
  PeikaAppStoreCloud:
    build:
      targets:
        PeikaAppStore: all
    run:
      config: DebugCloud
    archive:
      config: Release
  PeikaPhone:
    build:
      targets:
        PeikaPhone: all
    run:
      config: Debug
    archive:
      config: Release
  # Same iPhone app on the Production CloudKit environment, to talk to the
  # Developer ID build (scripts/cloud-test-build.sh), which can only use Production.
  PeikaPhoneProduction:
    build:
      targets:
        PeikaPhone: all
    run:
      config: DebugCloud
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Peika
        CFBundleDisplayName: Peika
        CFBundleIdentifier: dev.kura120.peika.direct
        CFBundleVersion: "15"
        CFBundleShortVersionString: "0.3.0"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal, envoyer des mails et piloter Musique et Spotify."
        NSMicrophoneUsageDescription: "Peika uses the microphone when you dictate a message in the chat."
        NSSpeechRecognitionUsageDescription: "Peika turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte."
        NSContactsUsageDescription: "Peika looks up an email address when you ask it, by voice, to prepare an email."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kura120.peika.direct
        PRODUCT_NAME: Peika
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PHONE_LINK"
          # The build run every day from Xcode: optimized like Release, so Peika's
          # drawing costs what it costs for users (unoptimized Swift was ~2× the CPU).
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        # The distributed build carries the iPhone sync (off until the user
        # turns it on in Settings), so it needs iCloud and its Developer ID profile.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Peika Developer ID"
        ReleaseCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Peika Developer ID"
    postBuildScripts:
      - name: "Write Git Hash to Info.plist"
        script: |
          HASH=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :PeikaGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :PeikaGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false

  PeikaAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: Resources/InfoAppStore.plist
      properties:
        CFBundleName: Peika
        CFBundleDisplayName: Peika
        CFBundleIdentifier: dev.kura120.peika
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.1"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: NO
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kura120.peika
        PRODUCT_NAME: Peika
        INFOPLIST_FILE: Resources/InfoAppStore.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/PeikaAppStore.entitlements
        DEVELOPMENT_TEAM: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        CODE_SIGNING_ALLOWED: YES
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"
        # App Store archive: same iCloud entitlements; Xcode switches push to
        # production when exporting for the App Store.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaAppStoreCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "APPSTORE PHONE_LINK"

  # iPhone app. Same bundle ID as the Mac App Store build, for universal purchase.
  PeikaPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - target: PeikaWidgets
      - target: PeikaNotificationContent
    sources:
      - path: Sources/Phone
        type: group
      # Shared with the Mac targets (they get it through Sources/).
      - path: Sources/PeikaKit
        type: group
      - path: PhoneAssets.xcassets
        buildPhase: resources
      # Peika's sounds for the iPhone's notifications.
      - path: Resources/sounds/approval.wav
        buildPhase: resources
      - path: Resources/sounds/finish.wav
        buildPhase: resources
      - path: Resources/sounds/question.wav
        buildPhase: resources
      - path: Resources/sounds/error.wav
        buildPhase: resources
    info:
      path: Resources/InfoPhone.plist
      properties:
        CFBundleName: Peika
        CFBundleDisplayName: Peika
        CFBundleIdentifier: dev.kura120.peika
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: YES
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: YES
        UIBackgroundModes:
          - remote-notification
        # Portrait, except a diff opened full screen (PhoneAppDelegate decides).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: NO
        NSFaceIDUsageDescription: "Peika asks for Face ID before allowing a command from your iPhone."
        NSMicrophoneUsageDescription: "Peika uses the microphone when you dictate an instruction for Claude Code."
        NSSpeechRecognitionUsageDescription: "Peika turns your voice into the text of an instruction for Claude Code."
        NSSupportsLiveActivities: YES
        # Lets Peika move at 120 Hz on ProMotion screens, like the Mac's notch.
        CADisableMinimumFrameDurationOnPhone: YES
        # Steps change often while an agent works: without this, iOS holds back
        # updates once its budget is spent, and "waiting for your OK" came late.
        NSSupportsLiveActivitiesFrequentUpdates: YES
        # peika://session/<id>: the widgets open a session in the app.
        CFBundleURLTypes:
          - CFBundleURLName: dev.kura120.peika
            CFBundleURLSchemes:
              - peika
        # Which APNs environment the Live Activity tokens belong to (read by the Mac).
        PeikaAPNsEnvironment: $(PEIKA_APNS_ENV)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kura120.peika
        PRODUCT_NAME: Peika
        INFOPLIST_FILE: Resources/InfoPhone.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Peika in other colors, picked in Settings (UIApplication.setAlternateIconName).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Blue AppIcon-Green AppIcon-Purple AppIcon-Pink AppIcon-Graphite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        PEIKA_APNS_ENV: production
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/PeikaPhone.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
      configs:
        Debug:
          PEIKA_APNS_ENV: development
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/PeikaPhoneProduction.entitlements
          PEIKA_APNS_ENV: development

  # Home Screen and Lock Screen widgets (Solo, Team, List, accessories). They
  # read the sessions the iPhone app saves to the shared App Group.
  PeikaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Widgets
        type: group
      - path: Sources/PeikaKit
        type: group
      - path: Sources/Phone/SharedSessions.swift
      - path: Sources/Phone/MacStubs.swift
      - path: Sources/Phone/PeikaActivityAttributes.swift
      - path: Sources/Phone/OpenLeadPeikaIntent.swift
      - path: Sources/Phone/DenyApprovalIntent.swift
    info:
      path: Resources/InfoWidgets.plist
      properties:
        CFBundleName: PeikaWidgets
        CFBundleDisplayName: Peika
        CFBundleIdentifier: dev.kura120.peika.Widgets
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kura120.peika.Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_NAME: PeikaWidgets
        INFOPLIST_FILE: Resources/InfoWidgets.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/PeikaWidgets.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # The expanded approval notification: Peika alive, with the command.
  PeikaNotificationContent:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/NotificationContent
        type: group
      - path: Sources/PeikaKit
        type: group
      - path: Sources/Phone/PeikaLive.swift
      - path: Sources/Phone/MacStubs.swift
    info:
      path: Resources/InfoNotificationContent.plist
      properties:
        CFBundleName: PeikaNotificationContent
        CFBundleDisplayName: Peika
        CFBundleIdentifier: dev.kura120.peika.NotificationContent
        CFBundleVersion: "3"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationViewController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: PEIKA_APPROVAL
            UNNotificationExtensionInitialContentSizeRatio: 0.45
            UNNotificationExtensionDefaultContentHidden: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kura120.peika.NotificationContent
        PRODUCT_NAME: PeikaNotificationContent
        INFOPLIST_FILE: Resources/InfoNotificationContent.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_CODE_SIGN_FLAGS: ""
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
